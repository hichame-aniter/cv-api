image: golang:tip-alpine3.23
stages:
  - test
  - verify
  - build
  - deliver
  - deploy

variables:
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  CLUSTER_NAME: homelab-cluster
  COVERAGE_THRESHOLD: 90  # Minimum coverage percentage required
  GO_VERSION: "1.26.1-alpine3.23"

services:
  - docker:dind

unit_tests:
  stage: test
  cache:
    paths:
      - .cache/go/
      - go.sum
    key:
      files:
        - go.sum
  before_script:
    - mkdir -p .cache/go
    - export GOPATH=$CI_PROJECT_DIR/.cache/go
    - export GOCACHE=$CI_PROJECT_DIR/.cache/go/build
    - go mod download
  script: 
    - echo "Running unit tests..."
    - go test -v ./... -coverpkg=./... -coverprofile=coverage.out
    - go tool cover -func=coverage.out | grep total | awk '{print $3}' > coverage_percentage.txt
    - go tool cover -html=coverage.out -o coverage.html
  artifacts:
    paths:
      - coverage.out
      - coverage.html
      - coverage_percentage.txt
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    expire_in: 7 days
  coverage: '/total:.*?(\d+(?:\.\d+)?)%/'

# Job for verifying coverage meets threshold
coverage-verify:
  stage: verify
  image: alpine:latest
  needs:
    - unit_tests
  script:
    - COVERAGE=$(cat coverage_percentage.txt | tr -d '%')
    - echo "Current coverage ${COVERAGE}%"
    - echo "Required coverage ${COVERAGE_THRESHOLD}%"
    - |
      if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
        echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
        exit 1
      else
        echo "Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
      fi
  dependencies:
    - unit_tests

# Optional: Generate detailed coverage report for GitLab UI

## Publish to Docker Hub registry 
docker_build:
  stage: build
  image: docker
  services:
    - docker:dind
  before_script:    
    - mkdir data
    - echo "$cv_api_data" > ./data/cv.json
  script: 
    - echo "Building Docker image..."
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $CONTAINER_IMAGE .
    - docker push $CONTAINER_IMAGE
    - |
      if [ -n "$CI_COMMIT_TAG"]; then
        echo "Tagging docker image with Git tag..."
        docker tag $CONTAINER_IMAGE $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG        
      fi
